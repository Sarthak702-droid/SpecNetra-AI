<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpecNetra · Autonomous QA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        margin: 0; padding: 0;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
        color: #e2e8f0;
        min-height: 100vh;
      }
      .brand-header {
        text-align: center; padding: 40px 0 4px;
        font-size: 32px; font-weight: 800;
        background: linear-gradient(90deg, #06b6d4, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: -0.5px;
      }
      .brand-sub {
        text-align: center; font-size: 11px; color: #64748b;
        margin-bottom: 32px; letter-spacing: 3px; text-transform: uppercase;
        font-weight: 500;
      }
      .card {
        max-width: 460px; margin: 0 auto;
        background: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        padding: 36px; border-radius: 20px;
        border: 1px solid rgba(6, 182, 212, 0.12);
        box-shadow: 0 0 60px rgba(6, 182, 212, 0.06), 0 8px 32px rgba(0,0,0,0.4);
        position: relative;
      }
      .card::before {
        content: ''; position: absolute; inset: -1px;
        border-radius: 21px; padding: 1px;
        background: linear-gradient(135deg, rgba(6,182,212,0.2), transparent 40%, rgba(167,139,250,0.15));
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor; mask-composite: exclude;
        pointer-events: none;
      }
      h1 { margin: 0 0 24px; font-size: 22px; font-weight: 700; color: #f1f5f9; }
      h2 { margin-top: 0; font-size: 18px; color: #f1f5f9; }
      h3 { margin: 0 0 8px; font-size: 16px; color: #e2e8f0; }
      .form-group { margin-bottom: 18px; }
      label {
        display: block; margin-bottom: 6px;
        font-weight: 600; font-size: 13px; color: #94a3b8;
        text-transform: uppercase; letter-spacing: 0.5px;
      }
      input {
        width: 100%; padding: 12px 14px;
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid #334155;
        border-radius: 10px; color: #e2e8f0;
        font-size: 15px; font-family: inherit;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      input:focus {
        outline: none;
        border-color: #06b6d4;
        box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.12);
      }
      input::placeholder { color: #475569; }
      button {
        width: 100%; padding: 13px;
        background: linear-gradient(135deg, #06b6d4, #0891b2);
        color: white; border: none; border-radius: 10px;
        font-size: 15px; font-weight: 700; cursor: pointer;
        font-family: inherit;
        transition: transform 0.1s, box-shadow 0.2s;
        letter-spacing: 0.3px;
      }
      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 24px rgba(6, 182, 212, 0.3);
      }
      button:active { transform: translateY(0); }
      .error {
        color: #f59e0b; margin-top: 10px;
        font-weight: 600; font-size: 14px;
        display: flex; align-items: center; gap: 6px;
      }
      .detail-box {
        background: rgba(6, 182, 212, 0.05);
        border: 1px solid rgba(6, 182, 212, 0.15);
        padding: 20px; border-radius: 14px; margin-top: 20px;
      }
      .detail-box p { margin: 6px 0; font-size: 14px; color: #cbd5e1; }
      .detail-box strong { color: #94a3b8; font-weight: 600; }
      a { color: #22d3ee; text-decoration: none; }
      a:hover { text-decoration: underline; }
      ul { list-style: none; padding: 0; margin: 0; }
      ul li {
        padding: 12px 16px; margin-bottom: 8px;
        background: rgba(15, 23, 42, 0.5);
        border-radius: 10px;
        border: 1px solid rgba(51, 65, 85, 0.5);
        transition: border-color 0.2s;
      }
      ul li:hover { border-color: rgba(6, 182, 212, 0.3); }
      .status-badge {
        display: inline-block; padding: 2px 10px;
        border-radius: 20px; font-size: 11px;
        font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
      }
      .status-scheduled { background: rgba(6,182,212,0.15); color: #22d3ee; }
      .status-confirmed { background: rgba(34,197,94,0.15); color: #4ade80; }
      .status-completed { background: rgba(167,139,250,0.15); color: #a78bfa; }
      .status-cancelled { background: rgba(245,158,11,0.15); color: #f59e0b; }
      .back-link {
        display: inline-flex; align-items: center; gap: 4px;
        color: #64748b; font-size: 13px; font-weight: 500;
        margin-bottom: 16px; text-decoration: none;
      }
      .back-link:hover { color: #22d3ee; text-decoration: none; }
    </style>
  </head>
  <body>
    <div class="brand-header">SpecNetra</div>
    <div class="brand-sub">Autonomous QA Intelligence</div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

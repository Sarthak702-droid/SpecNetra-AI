name: SpecNetra AI CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Style Check (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: pip install ruff
      - name: Run Ruff Lint & Format Check
        run: |
          ruff check app/ tests/
          ruff format --check app/ tests/

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run Unit Tests
        run: pytest tests/unit/ -v -m unit

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          python -m playwright install --with-deps chromium
      - name: Run Integration Tests
        run: pytest tests/integration/ -v -m integration

  e2e-healthy:
    name: E2E Verification (Healthy Demo)
    runs-on: ubuntu-latest
    needs: integration-tests
    env:
      LLM_PROVIDER: openai
      LLM_MODEL: gpt-4o-mini
      LLM_API_KEY: ${{ secrets.LLM_API_KEY || 'test-key' }}
      PLAN_MODE: fixture
      TEST_USER_EMAIL: tester@example.test
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD || 'SecretPassword123!' }}
      DEMO_BUG_MODE: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build demo web frontend
        run: |
          cd demo/web
          npm install
          npm run build
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          python -m playwright install --with-deps chromium
      - name: Run E2E Healthy Test
        run: pytest tests/end_to_end/test_healthy_run.py -v -m e2e
      - name: Upload Output Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthy-run-artifacts
          path: output/

  e2e-defective:
    name: E2E Verification (Intentional Bug Detection)
    runs-on: ubuntu-latest
    needs: integration-tests
    env:
      LLM_PROVIDER: openai
      LLM_MODEL: gpt-4o-mini
      LLM_API_KEY: ${{ secrets.LLM_API_KEY || 'test-key' }}
      PLAN_MODE: fixture
      TEST_USER_EMAIL: tester@example.test
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD || 'SecretPassword123!' }}
      DEMO_BUG_MODE: hide_created_appointment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build demo web frontend
        run: |
          cd demo/web
          npm install
          npm run build
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          python -m playwright install --with-deps chromium
      - name: Run E2E Defective Test
        run: pytest tests/end_to_end/test_defective_run.py -v -m e2e
      - name: Upload Failure Evidence & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: defective-run-evidence
          path: output/

  docker-e2e:
    name: Docker Compose Verification
    runs-on: ubuntu-latest
    needs: [e2e-healthy, e2e-defective]
    steps:
      - uses: actions/checkout@v4
      - name: Run Docker Compose Healthy E2E
        run: docker compose up --build --abort-on-container-exit --exit-code-from runner
      - name: Verify Clean Runner Exit
        run: echo "Docker Compose runner exited successfully"


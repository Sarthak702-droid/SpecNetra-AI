services:
  demo-api:
    build:
      context: .
      dockerfile: demo/api/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - DEMO_BUG_MODE=${DEMO_BUG_MODE:-}
      - TEST_USER_EMAIL=${TEST_USER_EMAIL:-tester@example.test}
      - TEST_USER_PASSWORD=${TEST_USER_PASSWORD:-SecretPassword123!}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks:
      - specnetra-net

  demo-web:
    build:
      context: demo/web
    ports:
      - "3000:3000"
    depends_on:
      demo-api:
        condition: service_healthy
    networks:
      - specnetra-net

  runner:
    build:
      context: .
    depends_on:
      demo-api:
        condition: service_healthy
      demo-web:
        condition: service_started
    environment:
      - API_BASE_URL=http://demo-api:8001
      - WEB_BASE_URL=http://demo-web:3000
      - ALLOWED_TARGET_HOSTS=demo-api,demo-web,localhost,127.0.0.1
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - LLM_API_KEY=${LLM_API_KEY:-test-key}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-${LLM_API_KEY:-test-key}}
      - PLAN_MODE=${PLAN_MODE:-fixture}
      - DEMO_BUG_MODE=${DEMO_BUG_MODE:-}
      - TEST_USER_EMAIL=${TEST_USER_EMAIL:-tester@example.test}
      - TEST_USER_PASSWORD=${TEST_USER_PASSWORD:-SecretPassword123!}
      - OUTPUT_DIR=/app/output
      - BROWSER_HEADLESS=true
    volumes:
      - ./output:/app/output
      - ./inputs:/app/inputs:ro
    networks:
      - specnetra-net

networks:
  specnetra-net:
    driver: bridge

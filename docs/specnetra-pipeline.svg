<svg width="920" height="250" viewBox="0 0 920 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">SpecNetra AI verification pipeline</title>
  <desc id="desc">Requirements flow through ingestion, strategy, verification, and evidence-backed reporting.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="920" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/>
      <stop offset="0.5" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#06b6d4" stroke-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="920" height="250" rx="18" fill="url(#bg)"/>
  <rect width="920" height="250" rx="18" fill="url(#grid)"/>
  <path d="M54 125H866" stroke="url(#accent)" stroke-opacity=".18" stroke-width="2" stroke-dasharray="8 10"/>
  <circle cx="54" cy="125" r="5" fill="#a78bfa" filter="url(#glow)">
    <animate attributeName="cx" values="54;866;54" dur="6s" repeatCount="indefinite"/>
  </circle>
  <g font-family="'Inter', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <g transform="translate(62 72)"><rect width="145" height="106" rx="14" fill="#1e293b" stroke="#06b6d4" stroke-opacity=".35"/><text x="72" y="37" fill="#a78bfa" font-size="12" font-weight="800">01</text><text x="72" y="62" fill="white" font-size="15" font-weight="700">INGEST</text><text x="72" y="84" fill="#94a3b8" font-size="11">requirements + API</text><text x="72" y="99" fill="#94a3b8" font-size="11">+ scenarios</text></g>
    <g transform="translate(270 72)"><rect width="145" height="106" rx="14" fill="#1e293b" stroke="#06b6d4" stroke-opacity=".35"/><text x="72" y="37" fill="#a78bfa" font-size="12" font-weight="800">02</text><text x="72" y="62" fill="white" font-size="15" font-weight="700">STRATEGIZE</text><text x="72" y="84" fill="#94a3b8" font-size="11">validated test</text><text x="72" y="99" fill="#94a3b8" font-size="11">graph</text></g>
    <g transform="translate(478 72)"><rect width="145" height="106" rx="14" fill="#1e293b" stroke="#06b6d4" stroke-opacity=".35"/><text x="72" y="37" fill="#a78bfa" font-size="12" font-weight="800">03</text><text x="72" y="62" fill="white" font-size="15" font-weight="700">VERIFY</text><text x="72" y="84" fill="#94a3b8" font-size="11">HTTPX +</text><text x="72" y="99" fill="#94a3b8" font-size="11">Playwright</text></g>
    <g transform="translate(686 72)"><rect width="172" height="106" rx="14" fill="#1e293b" stroke="#a78bfa" stroke-opacity=".5"/><text x="86" y="37" fill="#a78bfa" font-size="12" font-weight="800">04</text><text x="86" y="62" fill="white" font-size="15" font-weight="700">REPORT</text><text x="86" y="84" fill="#94a3b8" font-size="11">verdict + screenshots</text><text x="86" y="99" fill="#94a3b8" font-size="11">+ RCA</text></g>
  </g>
  <circle cx="207" cy="125" r="3.5" fill="#06b6d4"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/></circle>
  <circle cx="415" cy="125" r="3.5" fill="#06b6d4"><animate attributeName="opacity" values="1;.2;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <circle cx="623" cy="125" r="3.5" fill="#a78bfa"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/></circle>
</svg>
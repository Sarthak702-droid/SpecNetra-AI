[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "specnetra-ai"
version = "1.0.0"
description = "Autonomous Multi-Agent Software Testing Framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=0.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pydantic-ai>=0.0.14",
  "httpx>=0.27",
  "playwright>=1.45",
  "jsonschema>=4.23",
  "openapi-spec-validator>=0.7",
  "python-dotenv>=1.0",
  "structlog>=24.1",
  "fastapi>=0.112",
  "uvicorn[standard]>=0.30",
  "anyio>=4.4",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "demo*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "unit: Unit tests",
  "integration: Integration tests",
  "e2e: End-to-end tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "UP017"]
